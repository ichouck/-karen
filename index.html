<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karen</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .karen {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #0b0b0b;
    }

    .header {
      padding: 25px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      background: #171717;
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 12px;
      max-width: 85%;
    }

    .karen-message {
      margin-right: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #222;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #151515;
      color: white;
      outline: none;
    }

    button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="karen">

    <div class="header">
      KAREN
    </div>

    <div class="status">
      ● Prête à vous assister
    </div>

    <div class="chat">
      <div class="message karen-message">
        Bonjour. Je suis Karen. Comment puis-je vous aider ?
      </div>
    </div>

    <div class="input-area">
      <input type="text" placeholder="Écrivez à Karen...">
      <button>➤Envoyer</button>
    </div>

  </div>

</body>
</html>
