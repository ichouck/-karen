<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAREN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .karen {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      display: flex;
      flex-direction: column;
      background: #0b0b0b;
    }

    .header {
      padding: 25px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin-bottom: 15px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 14px 16px;
      border-radius: 18px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.4;
    }

    .karen-message {
      margin-right: auto;
      background: #171717;
    }

    .user-message {
      margin-left: auto;
      background: white;
      color: black;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #222;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #333;
      background: #151515;
      color: white;
      outline: none;
    }

    button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 20px;
      cursor: pointer;
    }

    button:hover {
      background: #cccccc;
    }
  </style>
</head>

<body>

  <div class="karen">
    <div class="header">KAREN</div>

    <div class="status" id="status">
      ● Prête à vous assister
    </div>

    <div class="chat" id="chat">
      <div class="message karen-message">
        Bonjour. Je suis Karen. Comment puis-je vous aider ?
      </div>
    </div>

    <form class="input-area" id="messageForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Écrivez à Karen..."
        autocomplete="off"
      >

      <button type="submit">➤</button>
    </form>
  </div>

  <script>
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");
    const status = document.getElementById("status");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const message = input.value.trim();

      if (message === "") {
        return;
      }

      ajouterMessage(message, "user-message");
      input.value = "";

      status.textContent = "● Karen réfléchit...";

      setTimeout(() => {
        ajouterMessage(
          "J’ai bien reçu votre message. Je suis encore en cours de connexion à mon intelligence artificielle.",
          "karen-message"
        );

        status.textContent = "● Prête à vous assister";
      }, 800);
    });

    function ajouterMessage(texte, classe) {
      const message = document.createElement("div");

      message.className = "message " + classe;
      message.textContent = texte;

      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
